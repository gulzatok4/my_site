<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Все услуги Gulzat — IT-системы, CRM, сайты, боты и ИИ-ролики."
    />
    <title>Услуги — Gulzat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=161" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body class="products-page" data-i18n-title="page.servicesTitle">
    <header class="nav">
      <a class="logo" href="./index.html">Gulzat</a>
      <div class="nav-actions">
        <a class="pill nav-hide-mobile" href="./index.html#top" data-i18n="nav.home">Главная</a>
        <a class="pill nav-hide-mobile" href="./index.html#shop" data-i18n="nav.shop">Магазин</a>
        <a class="pill is-active" href="./services.html" data-i18n="nav.services">Услуги</a>
        <a class="pill" href="./products.html" data-i18n="nav.products">Товары</a>
        <button type="button" class="cart-toggle" id="cart-toggle" data-i18n-aria="nav.cart" aria-label="Корзина" aria-expanded="false" aria-controls="cart-panel">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM3 3h2.2l.5 2H21l-2.2 8.2A2 2 0 0 1 16.9 15H8.1a2 2 0 0 1-2-1.6L4.1 4H3V3zm5.1 10h8.6l1.5-5.5H7.1L8.1 13z"
            />
          </svg>
          <span class="cart-label" data-i18n="nav.cart">Корзина</span>
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </button>
        <a class="pill" href="./index.html#contact" data-contact-open data-i18n="nav.contact">Связаться</a>
        <button type="button" class="lang-switch" data-lang-cycle aria-label="Язык">РУС</button>
      </div>
    </header>

    <div class="cart-backdrop" id="cart-backdrop" hidden></div>
    <aside class="cart-panel" id="cart-panel" aria-hidden="true" aria-labelledby="cart-title">
      <div class="cart-panel-head">
        <h2 id="cart-title" data-i18n="cart.title">Корзина</h2>
        <button type="button" class="cart-close" id="cart-close" data-i18n-aria="cart.close" aria-label="Закрыть корзину">×</button>
      </div>
      <div class="cart-list" id="cart-list"></div>
      <div class="cart-footer" id="cart-footer" hidden>
        <p class="cart-total" id="cart-total"></p>
        <button type="button" class="btn" id="cart-order-wa" data-i18n="cart.checkout">Оформить заказ</button>
        <a class="btn" id="cart-add-more" href="./products.html" data-i18n="cart.addMore">Добавить ещё товары</a>
        <button type="button" class="btn btn-ghost cart-clear" id="cart-clear" data-i18n="cart.clear">Очистить корзину</button>
      </div>
    </aside>

    <main id="top">
      <section class="shop catalog" id="shop">
        <div class="catalog-head">
          <a class="catalog-back" href="./index.html" data-i18n="catalog.back">← На главную</a>
          <div class="catalog-titles">
            <p class="catalog-kicker" data-i18n="catalog.services.kicker">Главная · Услуги</p>
            <div class="catalog-title-row">
              <h1 data-i18n="catalog.services.title">Все услуги</h1>
              <div class="cat-pick catalog-cat" id="services-page-cat"></div>
            </div>
            <p>Выберите услугу и оформите заказ.</p>
          </div>
        </div>
        <div class="shop-grid catalog-grid" id="services-catalog-grid"></div>
      </section>
    </main>

    <footer>
      <span>Gulzat · 2026</span>
      <span><a href="./index.html" data-i18n="footer.home">На главную</a></span>
    </footer>

    <script src="./i18n.js?v=8"></script>
    <script src="./products.js?v=56"></script>
    <script src="./script.js?v=98"></script>
    <script src="./chat-widget.js?v=23"></script>
  </body>
</html>
